<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tonidex</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #f3f2ef; --bg2: #ffffff; --ink: #141414; --muted: #8a8780; --line: #d9d6cf;
    --card: rgba(255,255,255,.86); --card-ink: #141414; --shadow: 0 10px 40px rgba(20,20,20,.08);
    --intelligence: #1f3a8a; --building: #b0861c; --craft: #c2272d; --business: #6b4c9a;
  }
  :root[data-theme="ink"] {
    --bg: #0d0e10; --bg2: #16181b; --ink: #ecebe6; --muted: #7c7d80; --line: #2a2c30;
    --card: rgba(22,24,27,.9); --card-ink: #ecebe6; --shadow: 0 10px 40px rgba(0,0,0,.5);
    --intelligence: #7f9cff; --building: #e0b445; --craft: #ff5a52; --business: #b48cf0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "Space Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas#map { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
  canvas#map.dragging { cursor: grabbing; }
  canvas#map.pointer { cursor: pointer; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .serif { font-family: "Instrument Serif", Georgia, serif; }

  /* top bar */
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; pointer-events: none; z-index: 5; flex-wrap: wrap; }
  #top > * { pointer-events: auto; }
  #controls { display: flex; gap: 14px; align-items: center; }
  #brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  #brand a { color: inherit; text-decoration: none; }
  #brand .word { font-family: "Instrument Serif", serif; font-size: 30px; letter-spacing: -.01em; line-height: 1; }
  #brand .sub { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; backdrop-filter: blur(10px); box-shadow: var(--shadow); }
  .seg button { all: unset; cursor: pointer; font-size: 12px; padding: 6px 12px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
  .seg button.on { background: var(--ink); color: var(--bg); }
  #sources button { display: inline-flex; align-items: center; gap: 6px; }
  #sources button:not(.on) { text-decoration: line-through; opacity: .6; }
  .seg button:focus-visible { outline: 2px solid var(--intelligence); }
  #search { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 6px 4px 12px; box-shadow: var(--shadow); backdrop-filter: blur(10px); }
  #search input { all: unset; width: 190px; font-size: 13px; color: var(--ink); }
  #search input::placeholder { color: var(--muted); }
  #search kbd { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  #search button { all: unset; cursor: pointer; font-size: 11px; padding: 4px 9px; border-radius: 999px; background: var(--ink); color: var(--bg); }
  select.pill { appearance: none; background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 7px 28px 7px 12px;
    font: 12px "Space Grotesk", sans-serif; box-shadow: var(--shadow); cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }

  /* breadcrumb / focus card (the "01 OPERATION" card) */
  #focus { position: fixed; left: 18px; top: 78px; z-index: 6; width: min(360px, calc(100vw - 36px));
    background: #121315; color: #f1efe9; border: 1px solid #2b2d31; border-radius: 16px; padding: 16px 18px 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35); opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s; pointer-events: none; }
  #focus.show { opacity: 1; transform: none; pointer-events: auto; }
  #focus .row { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; position: relative; }
  #focus .row + .row { margin-top: 10px; }
  #focus .row:not(:last-child)::after { content: ""; position: absolute; left: 21px; top: 42px; height: 12px; width: 1.5px; background: var(--fc); opacity: .9; }
  #focus .ico { width: 44px; height: 40px; display: grid; place-items: center; border: 1.5px solid var(--fc); border-radius: 12px; }
  #focus .ico.round { border-radius: 50%; height: 44px; }
  #focus .k { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .14em; color: #9a9893; }
  #focus .k b { color: var(--fc); font-weight: 500; margin-right: 6px; }
  #focus .v { font-size: 21px; line-height: 1.1; margin-top: 2px; }
  #focus .v.serif { font-size: 28px; }
  #focus .v.mono { font-size: 17px; }
  #focus .v.it { font-family: "Instrument Serif", serif; font-style: italic; font-size: 21px; }
  #focus .x { position: absolute; top: 8px; right: 10px; all: unset; cursor: pointer; color: #9a9893; font-size: 18px; padding: 4px 8px; position: absolute; top: 6px; right: 6px; }
  #focus .stack { width: 40px; height: 36px; position: relative; }
  #focus .stack img, #focus .stack span { position: absolute; width: 26px; height: 32px; object-fit: cover; border-radius: 3px; border: 1px solid #f1efe9; background: #333; }

  /* detail drawer */
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); z-index: 8; background: var(--bg2); color: var(--ink);
    border-left: 1px solid var(--line); box-shadow: -20px 0 60px rgba(0,0,0,.12); transform: translateX(102%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column; }
  #drawer.open { transform: none; }
  #drawer header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  #drawer header .k { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  #drawer header button { all: unset; cursor: pointer; font-size: 20px; color: var(--muted); padding: 2px 6px; }
  #drawer .body { overflow-y: auto; padding: 18px; flex: 1; }
  #drawer .hero { width: 100%; border-radius: 10px; display: block; background: var(--line); max-height: 60vh; object-fit: contain; }
  #drawer .idea { font-family: "Instrument Serif", serif; font-size: 26px; line-height: 1.2; padding: 22px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  #drawer p.cap { font-family: "Instrument Serif", serif; font-style: italic; font-size: 17px; line-height: 1.35; color: var(--muted); margin: 10px 0 0; }
  #drawer h3 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 24px; line-height: 1.2; margin: 16px 0 8px; }
  #drawer p.txt { font-size: 14px; line-height: 1.55; color: var(--ink); opacity: .85; white-space: pre-wrap; word-wrap: break-word; margin: 0 0 12px; }
  #drawer .meta { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); margin-bottom: 14px; }
  #drawer .group { margin: 14px 0; }
  #drawer .group .k { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin-bottom: 7px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; margin: 0 6px 6px 0; cursor: pointer; background: var(--bg); color: var(--ink); }
  .chip:hover { border-color: var(--ink); }
  .chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .chip.tag { cursor: default; font-family: "IBM Plex Mono", monospace; font-size: 11px; border-style: dashed; }
  #drawer a.open { display: inline-block; margin-top: 4px; font-size: 13px; color: var(--ink); }
  #drawer .back { all: unset; cursor: pointer; font-size: 12px; color: var(--muted); margin-bottom: 12px; display: inline-block; }
  #drawer .back:hover { color: var(--ink); }
  .srcs { margin: 6px 0 14px; } .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .rows { display: flex; flex-direction: column; gap: 2px; }
  .lrow { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 8px; border-radius: 8px; cursor: pointer; align-items: start; }
  .lrow:hover { background: var(--bg); }
  .lrow .th { width: 64px; height: 64px; border-radius: 6px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); display: grid; place-items: center; }
  .lrow .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lrow .th span { font-family: "Instrument Serif", serif; font-style: italic; font-size: 10px; line-height: 1.1; padding: 5px; color: var(--muted); overflow: hidden; max-height: 100%; }
  .lrow .src { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .lrow .t { font-size: 13.5px; line-height: 1.4; margin-top: 3px; }
  .lrow .d { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted); margin-top: 3px; }
  .sb { width: 8px; height: 8px; border-radius: 2px; display: inline-block; background: var(--muted); }
  .sb-x { background: var(--ink); } .sb-tiktok { background: #ff0050; } .sb-instagram { background: #c13584; } .sb-youtube { background: #ff0000; }
  .sb-voice, .sb-thought { background: var(--building); } .sb-take, .sb-post { background: var(--craft); } .sb-work { background: var(--intelligence); }
  .related { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .related div { aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--line); cursor: pointer; display: grid; place-items: center;
    font-family: "Instrument Serif", serif; font-size: 12px; padding: 4px; text-align: center; line-height: 1.1; color: var(--ink); }
  .related img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* bottom bar */
  #bottom { position: fixed; left: 18px; right: 18px; bottom: 16px; display: flex; gap: 10px; align-items: center; z-index: 5; pointer-events: none; flex-wrap: wrap; }
  #bottom > * { pointer-events: auto; }
  #legend { display: flex; gap: 14px; font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .06em; color: var(--muted); margin-left: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; backdrop-filter: blur(10px); }
  #legend span { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-transform: uppercase; }
  #legend span i { width: 8px; height: 8px; border-radius: 50%; }
  #legend span.off { opacity: .35; }
  .iconbtn { all: unset; cursor: pointer; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--ink); font-size: 14px; }

  #tip { position: fixed; z-index: 7; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 280px;
    opacity: 0; transition: opacity .12s; line-height: 1.35; }
  #tip.show { opacity: 1; }
  #tip .n { font-family: "IBM Plex Mono", monospace; font-size: 10px; opacity: .6; display: block; margin-top: 2px; }

  /* loader + auth */
  #veil { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; place-items: center; transition: opacity .5s; }
  #veil.gone { opacity: 0; pointer-events: none; }
  #veil .box { text-align: center; width: min(340px, 90vw); }
  #veil .word { font-family: "Instrument Serif", serif; font-size: 54px; line-height: 1; }
  #veil .k { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin: 10px 0 22px; }
  #veil .orbit { width: 64px; height: 64px; margin: 0 auto; position: relative; }
  #veil .orbit i { position: absolute; width: 9px; height: 9px; border-radius: 50%; left: 27px; top: 27px; animation: orb 1.6s cubic-bezier(.5,0,.5,1) infinite; }
  #veil .orbit i:nth-child(1) { background: var(--intelligence); }
  #veil .orbit i:nth-child(2) { background: var(--building); animation-delay: -.4s; }
  #veil .orbit i:nth-child(3) { background: var(--craft); animation-delay: -.8s; }
  #veil .orbit i:nth-child(4) { background: var(--business); animation-delay: -1.2s; }
  @keyframes orb { 0% { transform: rotate(0) translateX(24px); } 100% { transform: rotate(360deg) translateX(24px); } }
  #auth { display: none; flex-direction: column; gap: 8px; }
  #auth input { font: 14px "Space Grotesk", sans-serif; padding: 11px 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); }
  #auth button { font: 500 14px "Space Grotesk", sans-serif; padding: 11px; border-radius: 8px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; }
  #auth .err { color: var(--craft); font-size: 12px; min-height: 16px; }
  #veil .msg { font-size: 13px; color: var(--muted); margin-top: 16px; }

  @media (max-width: 720px) {
    #top { padding: 10px 12px; gap: 8px; }
    #brand { margin-right: 0; flex: 0 0 auto; }
    #search { flex: 1 1 auto; min-width: 0; } #search input { width: 100%; min-width: 60px; }
    #controls { width: calc(100% + 24px); margin: 0 -12px; padding: 2px 12px 8px; gap: 8px; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    #controls::-webkit-scrollbar { display: none; }
    #controls > * { flex: 0 0 auto; }
    #zin, #zout { display: none; }
    #bottom { flex-wrap: nowrap; }
    /* panels become a bottom sheet so the map stays visible above */
    #drawer { top: auto; height: 64vh; width: 100vw; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; transform: translateY(102%); box-shadow: 0 -20px 60px rgba(0,0,0,.18); }
    #drawer.open { transform: none; }
    #drawer header { padding: 10px 16px; position: relative; }
    #drawer header::before { content: ""; position: absolute; left: 50%; top: 5px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line); }
    #drawer .body { padding: 14px 16px 28px; }
    body.sheet #focus, body.sheet #bottom { display: none; }
    #brand .sub { display: none; }
    #search input { width: 120px; }
    #search kbd { display: none; }
    #brand .word { font-size: 26px; }
    .seg button { padding: 5px 9px; font-size: 11px; }
    select.pill { padding: 6px 24px 6px 10px; font-size: 11px; max-width: 130px; }
    #legend { display: none; }
    #sources button { padding: 5px 8px; }
    #focus { top: auto; bottom: 64px; left: 12px; }
    #bottom { left: 12px; right: 12px; }
  }
  /* ===== Visuals: mood board ===== */
  #visuals { position: fixed; inset: 0; z-index: 4; background: var(--bg); overflow-y: auto; overflow-x: hidden; display: none; -webkit-overflow-scrolling: touch; }
  body.vis #visuals { display: block; }
  body.vis canvas#map, body.vis #bottom, body.vis #focus, body.vis #layers, body.vis #layout, body.vis #folder { display: none !important; }
  body.vis #top { background: linear-gradient(var(--bg) 70%, transparent); }
  #vbar { position: sticky; top: 0; z-index: 2; padding: 74px 18px 12px; background: linear-gradient(var(--bg) 82%, transparent); display: flex; flex-direction: column; gap: 10px; }
  #vbar .line { display: flex; gap: 8px; align-items: center; overflow-x: auto; scrollbar-width: none; }
  #vbar .line::-webkit-scrollbar { display: none; }
  #vbar .lbl { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; flex: 0 0 auto; width: 58px; }
  .vchip { flex: 0 0 auto; font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; white-space: nowrap; }
  .vchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .vchip small { opacity: .55; margin-left: 4px; }
  .swatch { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; position: relative; }
  .swatch.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
  .swatch[data-c=""] { background: conic-gradient(#e5484d, #f5a524, #f5d90a, #46a758, #12a594, #0091ff, #8e4ec6, #e93d82, #e5484d); }
  #vcount { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--muted); margin-left: auto; flex: 0 0 auto; padding-left: 10px; }
  #vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); grid-auto-rows: 6px; gap: 0 14px; padding: 4px 18px 80px; }
  .vt { grid-row-end: span 40; margin-bottom: 14px; position: relative; border-radius: 10px; overflow: hidden; background: var(--line); cursor: zoom-in;
    opacity: 0; transform: translateY(18px) scale(.985); transition: opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1); }
  .vt.in { opacity: 1; transform: none; }
  .vt img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .vt:hover img { transform: scale(1.035); }
  .vt .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 11px 9px; font-size: 11.5px; line-height: 1.35; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.72));
    opacity: 0; transition: opacity .25s; pointer-events: none; }
  .vt:hover .cap { opacity: 1; }
  .vt .pal { position: absolute; top: 8px; left: 8px; display: flex; gap: 3px; opacity: 0; transition: opacity .25s; }
  .vt:hover .pal { opacity: 1; }
  .vt .pal i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,.7); }
  #vempty { padding: 60px 18px; text-align: center; color: var(--muted); font-family: "Instrument Serif", serif; font-size: 24px; display: none; }
  /* lightbox */
  #vlight { position: fixed; inset: 0; z-index: 12; background: rgba(10,10,12,.94); display: none; grid-template-columns: 1fr 380px; color: #f1efe9; }
  #vlight.open { display: grid; }
  #vlight .stage { display: grid; place-items: center; padding: 28px; min-height: 0; position: relative; }
  #vlight .stage img { max-width: 100%; max-height: calc(100vh - 56px); object-fit: contain; border-radius: 8px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  #vlight .nav { all: unset; position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); cursor: pointer; font-size: 18px; }
  #vlight .nav:hover { background: rgba(255,255,255,.16); }
  #vlight .prev { left: 14px; } #vlight .next { right: 14px; }
  #vlight aside { background: #141517; border-left: 1px solid #26282c; overflow-y: auto; padding: 20px 20px 40px; }
  #vlight aside .x { all: unset; cursor: pointer; float: right; font-size: 22px; color: #9a9893; padding: 0 4px; }
  #vlight .k { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .14em; color: #9a9893; text-transform: uppercase; margin: 18px 0 8px; }
  #vlight .cp { font-family: "Instrument Serif", serif; font-size: 24px; line-height: 1.25; margin-top: 10px; }
  #vlight .tw { font-size: 13px; line-height: 1.5; color: #c9c7c1; margin-top: 10px; white-space: pre-wrap; word-wrap: break-word; }
  #vlight .meta { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: #9a9893; margin-top: 10px; }
  #vlight .pals { display: flex; gap: 8px; }
  #vlight .pals button { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); }
  #vlight .tags span { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 11px; border: 1px dashed #3a3c41; border-radius: 6px; padding: 4px 8px; margin: 0 6px 6px 0; cursor: pointer; color: #d8d6d0; }
  #vlight .tags span:hover { border-color: #f1efe9; }
  #vlight .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  #vlight .acts a, #vlight .acts button { all: unset; cursor: pointer; font-size: 12.5px; padding: 8px 12px; border-radius: 8px; background: #23252a; color: #f1efe9; }
  #vlight .acts a:hover, #vlight .acts button:hover { background: #2f3238; }
  #vlight .sim { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #vlight .sim div { aspect-ratio: 1; border-radius: 6px; overflow: hidden; cursor: pointer; background: #23252a; }
  #vlight .sim img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
  #vlight .sim div:hover img { transform: scale(1.06); }
  @media (max-width: 720px) {
    #vbar { padding: 110px 12px 10px; }
    #vbar .lbl { display: none; }
    #vgrid { grid-template-columns: repeat(2, 1fr); gap: 0 8px; padding: 2px 10px 60px; }
    .vt { margin-bottom: 8px; border-radius: 8px; }
    .vt .cap, .vt .pal { display: none; }

<script>

const cv = $('#map'); const ctx = cv.getContext('2d'); const CTX0 = ctx;
let W = 0, H = 0, DPR = 1;

/* =========================================================================
   DATA

async function load() {

function thumbUrls(it) {

    try {
      const u = new URL(m);
      if (!u.searchParams.get('format')) { const ext = (u.pathname.match(/\.(jpe?g|png|webp)$/i) || [])[1]; if (ext) { u.pathname = u.pathname.replace(/\.(jpe?g|png|webp)$/i, ''); u.searchParams.set('format', ext.toLowerCase() === 'jpeg' ? 'jpg' : ext.toLowerCase()); } }

const thumbUrl = (it) => thumbUrls(it)[1] || thumbUrls(it)[0] || null;

function build() {
  const raw = S.raw;

  S.conceptById = new Map(raw.concepts.map(c => [c.id, c]));
  // items in view
  const items = raw.items.filter(it => S.layers.has(it.layer) && (!S.folder || it.folder === S.folder) && !S.srcOff.has(channelOf(it)));
  // concept frequency in view
  const cnt = new Map();

  const minC = items.length > 300 ? S.minCount : 2;

    if (c.door && c.door !== 'cross_door') dc.set(c.door, (dc.get(c.door) || 0) + c.n * 0.6);

    const top = ranked[0]?.[1] || 0;
    c.doors = ranked.filter(([, v], i) => i === 0 || (v >= top * 0.35 && i < 3)).map(([d]) => d).filter(d => S.doorById.has(d));
    if (!c.doors.length) c.doors = ['creative_media'];

    const cs = it.concepts.filter(id => cset.has(id)).map(id => nById.get(id)).sort((a, b) => a.n - b.n);

    const doorsU = [...dc.entries()].sort((a, b) => b[1] - a[1]).map(([d]) => d).filter(d => S.doorById.has(d)).slice(0, 1);

/* =========================================================================
   LAYOUTS
   ========================================================================= */
function sizeOf(n) {
  if (n.layer === 'image') { const ar = n.ar || 1; const s = CELL - 8; return ar >= 1 ? [s, s / ar] : [s * ar, s]; }

  return [CELL - 6, 26];
}
const CELL = 62;          // one grid cell under a concept
const FAM_ORDER = ['Craft', 'Intelligence', 'Building', 'Business'];

// Every example hangs under ONE concept (its most specific one), in a small tidy grid.
// Order: family → door → concept, so the map reads left to right like the reference.
function groupBlocks() {
  const byC = new Map(S.concepts.map(c => [c, []]));
  for (const it of S.items) byC.get(it.pc)?.push(it);
  const layerRank = { image: 0, idea: 1, link: 2, work: 3 };
  const rank = (i) => i.kind === 'post' ? -1 : layerRank[i.layer];
  const doorRank = new Map([...S.doors].sort((a, b) => FAM_ORDER.indexOf(a.family) - FAM_ORDER.indexOf(b.family) || b.n - a.n).map((d, i) => [d.id, i]));
  const blocks = S.concepts.map(c => {
    const its = byC.get(c).sort((a, b) => rank(a) - rank(b) || String(b.at || '').localeCompare(String(a.at || '')));
    const hasPost = its.some(i => i.kind === 'post');
    const cols = clamp(Math.ceil(Math.sqrt(its.length / 3)), hasPost ? 2 : 1, 4);
    // slots: a blog post takes two cells side by side (centre offset by half a cell)
    const slots = []; let col = 0, row = 0;
    for (const it of its) {
      if (it.kind === 'post') { if (col > cols - 2) { col = 0; row++; } slots.push({ col: col + .5, row }); col += 2; }
      else { slots.push({ col, row }); col++; }
      if (col >= cols) { col = 0; row++; }
    }
    return { c, its, cols, slots, rows: row + (col ? 1 : 0), w: Math.max(cols, 1) * CELL };
  }).sort((a, b) => (doorRank.get(a.c.primary) ?? 99) - (doorRank.get(b.c.primary) ?? 99) || b.its.length - a.its.length);
  return blocks;
}

function layoutTree() {
  const P = new Map();
  const blocks = groupBlocks(); const GAP = 12;
  const total = blocks.reduce((a, b) => a + b.w + GAP, -GAP);
  let x = -total / 2;
  blocks.forEach((b, i) => {
    const cx = x + b.w / 2;
    P.set(b.c.key, { x: cx, y: 640 + (i % 3) * 82 });
    b.its.forEach((it, j) => { const { col, row } = b.slots[j];
      P.set(it.key, { x: x + CELL / 2 + col * CELL, y: 1000 + CELL / 2 + row * CELL }); });
    x += b.w + GAP;
  });
  // doors sit over the middle of their concepts; keep them apart
  const doors = [...S.doors].sort((a, b) => FAM_ORDER.indexOf(a.family) - FAM_ORDER.indexOf(b.family) || b.n - a.n);
  const dx = doors.map(d => { const xs = blocks.filter(b => b.c.primary === d.id).map(b => P.get(b.c.key).x); return xs.length ? (Math.min(...xs) + Math.max(...xs)) / 2 : 0; });
  const dw = (d) => d.label.length * 8.6 + 70; // chip width at the largest label size, plus air
  for (let i = 1; i < dx.length; i++) { const gap = (dw(doors[i - 1]) + dw(doors[i])) / 2; if (dx[i] < dx[i - 1] + gap) dx[i] = dx[i - 1] + gap; }
  doors.forEach((d, i) => P.set(d.key, { x: dx[i], y: 330 }));
  const fs = FAM_ORDER.map(id => S.fams.find(f => f.id === id)).filter(Boolean);
  const fx = fs.map(f => { const xs = doors.filter(d => d.family === f.id).map(d => P.get(d.key).x); return (Math.min(...xs) + Math.max(...xs)) / 2; });
  for (let i = 1; i < fx.length; i++) if (fx[i] < fx[i - 1] + 360) fx[i] = fx[i - 1] + 360;
  fs.forEach((f, i) => P.set(f.key, { x: fx[i], y: 0 }));
  return P;
}

function layoutWeb() {
  const P = new Map();
  const blocks = groupBlocks(); const R0 = 1200;
  // each concept gets an arc wide enough for its grid
  const arcs = blocks.map(b => b.w + 30); const sum = arcs.reduce((a, b) => a + b, 0);
  const R = Math.max(R0, sum / (2 * Math.PI));

    const span = arcs[i] / R, mid = a0 + span / 2; b.c._a = mid;

  });

  for (const d of S.doors) { const as = blocks.filter(b => b.c.primary === d.id).map(b => b.c._a); d._a = as.length ? circMean(as) : 0; P.set(d.key, { x: Math.cos(d._a) * (R - 760), y: Math.sin(d._a) * (R - 760) }); }
  for (const f of S.fams) { const as = S.doors.filter(d => d.family === f.id).map(d => d._a); const a = circMean(as); P.set(f.key, { x: Math.cos(a) * 170, y: Math.sin(a) * 170 }); }
  return P;
}

function applyLayout(animate = true) {
  const P = S.layout === 'web' ? layoutWeb() : layoutTree();
  // focus cluster overrides
  if (S.sel && S.sel.cluster) {
    const c = S.byKey.get(S.sel.anchor); const ids = [...S.sel.set];
    const center = S.layout === 'web' ? { x: c ? P.get(c.key).x * 1.25 : 0, y: c ? P.get(c.key).y * 1.25 : 0 } : { x: c ? P.get(c.key).x : 0, y: 1060 };
    const keys = ids.map(id => 'i' + id).filter(k => P.has(k));
    const cols = clamp(Math.ceil(Math.sqrt(keys.length * 1.8)), 1, 14), cs = CELL * 1.5;
    keys.forEach((k, i) => { const col = i % cols, row = Math.floor(i / cols);

    n.fx = n.x; n.fy = n.y; n.tx = t.x; n.ty = t.y;

/* =========================================================================
   SELECTION
   ========================================================================= */
function itemsOf(n) {
  if (n.key[0] === 'f') return S.items.filter(it => it.cs.some(c => S.byKey.get('d' + c.primary)?.family === n.id));
  if (n.key[0] === 'd') return S.items.filter(it => it.cs.some(c => c.doors.includes(n.id)));
  if (n.key[0] === 'c') return S.items.filter(it => it.cs.includes(n));
  return [];
}
function select(n, opts = {}) {
  if (!n) { const had = S.sel?.cluster; closeDrawer(); S.sel = null; $('#focus').classList.remove('show'); applyLayout(); if (had) setTimeout(() => frame(), 40); updateHash(); return; }
  const its = opts.items || itemsOf(n);
  const set = new Set(its.map(i => i.id));
  const nodes = new Set([n.key]);
  const fam = n.key[0] === 'f' ? n.id : n.key[0] === 'd' ? n.family : n.family;
  if (n.key[0] === 'f') { for (const d of S.doors) if (d.family === n.id) nodes.add(d.key); for (const c of S.concepts) if (c.doors.some(d => S.doorById.get(d)?.family === n.id)) nodes.add(c.key); }

  side.querySelectorAll('.sim img').forEach((im) => { im.onerror = () => { const o = S.byId.get(+im.parentElement.dataset.id); const u = tileUrls(o); const i = u.indexOf(im.src); if (i >= 0 && i + 1 < u.length) im.src = u[i + 1]; }; });
  side.querySelectorAll('[data-hex]').forEach(el => el.onclick = () => { const h = el.dataset.hex; const [r, g, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const [hh, ss, vv] = rgb2hsv(r, g, b); V.color = bucketOf(hh, ss, vv); syncSwatches(); closeLight(); renderVisuals(); $('#visuals').scrollTo({ top: 0, behavior: 'smooth' }); });
  side.querySelectorAll('[data-t]').forEach(el => el.onclick = () => { V.q = el.dataset.t; V.ids = null; qEl.value = V.q; closeLight(); renderVisuals(); $('#visuals').scrollTo({ top: 0, behavior: 'smooth' }); });
  $('#vl-map').onclick = () => { closeLight(); setMode('map'); const n = S.byKey.get('i' + id); if (n) { if (n.pc) select(n.pc); setTimeout(() => openDrawer(n), 350); } };
  side.scrollTop = 0;
  $('#vlight').classList.add('open');
}
function closeLight() { $('#vlight').classList.remove('open'); lightId = null; }
function stepLight(d) { if (lightId == null) return; const i = V.order.findIndex(x => x.id === lightId); const n = V.order[(i + d + V.order.length) % V.order.length]; if (n) openLight(n.id); }
$('#vlight .prev').onclick = () => stepLight(-1); $('#vlight .next').onclick = () => stepLight(1);
$('#vlight').addEventListener('click', (e) => { if (e.target.id === 'vlight' || e.target.classList.contains('stage')) closeLight(); });

/* ---- switching between the map and the board ---- */
function setMode(m) {
  S.mode = m; document.body.classList.toggle('vis', m === 'visuals');
  [...$('#mode').children].forEach(x => x.classList.toggle('on', x.dataset.m === m));
  try { localStorage.setItem('tonidex-mode', m); } catch {}
  if (m === 'visuals') { closeDrawer(); $('#focus').classList.remove('show'); renderVisuals(); qEl.placeholder = 'Search images: water, blue, chrome…'; }
  else { closeLight(); qEl.placeholder = 'Find, or ask by meaning…'; S.dirty = true; }
  updateHash();
}
$('#mode').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); });

/* ---------- auth + boot ---------- */
async function boot() {
  try { const t = localStorage.getItem('tonidex-theme'); if (t) setTheme(t); else readColors(); } catch { readColors(); }
  await document.fonts.ready.catch(() => {});
  readColors();
  try {
    S.raw = await load();
  } catch (err) {
    if (err.signin) { $('#orbit').style.display = 'none'; $('#auth').style.display = 'flex'; $('#veil-msg').textContent = 'Private. Sign in with your admin account.'; $('#a-email').focus(); return; }
    $('#veil-msg').textContent = 'Could not load the map: ' + err.message; return;
  }
  try { JSON.parse(localStorage.getItem('tonidex-src-off') || '[]').forEach(k => { S.srcOff.add(k); $(`#sources [data-s="${k}"]`)?.classList.remove('on'); }); } catch {}
  for (const it of S.raw.items) { it.r2 = typeof it.img === 'string' ? it.img : null; it.img = null; }
  const folders = [...new Set(S.raw.items.map(i => i.folder).filter(Boolean))];
  const fc = new Map(); S.raw.items.forEach(i => i.folder && fc.set(i.folder, (fc.get(i.folder) || 0) + 1));
  folders.sort((a, b) => fc.get(b) - fc.get(a));
  $('#folder').innerHTML = '<option value="">All folders</option>' + folders.map(f => `<option value="${esc(f)}">${esc(f)} (${fc.get(f)})</option>`).join('');
  const hp = new URLSearchParams(location.hash.slice(1));
  if (hp.get('v') === 'web' || (!hp.get('v') && innerWidth < 720)) { S.layout = 'web'; [...$('#layout').children].forEach(x => x.classList.toggle('on', x.dataset.v === 'web')); }
  build(); applyLayout(false); frame(null, true);
  if (S.layout === 'tree' && S.cam.k < .32) { S.cam = { x: 0, y: 520, k: .32 }; }
  // intro: start zoomed on the families, settle to the whole map
  const fin = { ...S.cam }; S.cam = { x: fin.x, y: S.layout === 'tree' ? 200 : 0, k: fin.k * 2.4 }; S.camT = { t0: performance.now() + 250, dur: 1400, a: { ...S.cam }, b: fin };
  $('#veil').classList.add('gone');
  let startMode = hp.get('m'); try { startMode = startMode || localStorage.getItem('tonidex-mode'); } catch {}
  if (startMode === 'visuals') setMode('visuals');
  const n = hp.get('n'); if (n && S.byKey.get(n)) setTimeout(() => select(S.byKey.get(n)), 1700);
}
$('#auth').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#a-err').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#a-email').value, password: $('#a-pass').value });
  if (error) { $('#a-err').textContent = error.message; return; }
  $('#auth').style.display = 'none'; $('#orbit').style.display = ''; $('#veil-msg').textContent = ''; boot();
});
window.__tonidex = S;
requestAnimationFrame(tick);
boot();
})();
</script>
