name: Tag and embed captures

on:
  schedule:
    # 06:00 UTC every Monday
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  tag-and-embed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Text tagging pass
        run: python scripts/tag_captures.py --all

      - name: Visual tagging pass
        run: python scripts/tag_images.py --all

      - name: Sync blog posts and drafts into the graph
        run: python scripts/sync_posts.py

      - name: Tag blog posts and drafts
        run: python scripts/tag_posts.py --all

      - name: Sync commentary into the graph
        run: python scripts/sync_commentary.py

      - name: Tag commentary
        run: python scripts/tag_posts.py --source commentary --all

      - name: Embed new nodes
        run: python scripts/embed_nodes.py
